name: Mantener despierto Supabase

# El proyecto de Supabase de BIODCORE se enfria cuando no se usa, y su primera
# respuesta despues de ese reposo es DEVASTADORA: 34,5 s la primera consulta,
# 1,75 la segunda, 0,41 la tercera. Netlify corta mucho antes, asi que quien
# abria la aplicacion tras un rato no veia una pantalla lenta: no veia
# pantalla.
#
# ─────────────────────────────────────────────────────────────────────────────
# CADA EJECUCION PINGEA DURANTE DIECISIETE HORAS, Y ESA ES LA CORRECCION
# ─────────────────────────────────────────────────────────────────────────────
#
# El `cron` de abajo pide 288 ejecuciones al dia. GITHUB DISPARA 5,7. En los
# repositorios publicos el evento `schedule` es de mejor esfuerzo y se descarta
# bajo carga; medido sobre las 61 ejecuciones de once dias, el hueco mediano
# fue de 254 minutos y el mayor de 428 — y LAS 61 SALIERON EN VERDE. Con eso
# la base estaba fria el 90,3% del tiempo mientras el ping decia que todo iba
# bien.
#
# Asi que lo que se arregla no es el intervalo: es cuanto DURA cada ejecucion.
# El trabajo ya no son diez segundos sino un bucle que pingea cada minuto
# durante 340, y van TRES ENCADENADOS: 1.020 minutos, diecisiete
# horas. GitHub solo tiene que acertar un disparo cada diecisiete horas, que
# es de sobra lo que hace.
#
#   cobertura por disparo      huecos sin cubrir de los 60 medidos
#   ───────────────────────    ───────────────────────────────────
#   10 s     · lo de antes     60 de 60   · fria el 90,3% del tiempo
#   340 min  · un trabajo      13 de 60   · fria el 2,8%
#   1.020 min · TRES           0 de 60
#
# SON TRES TRABAJOS Y NO UNO LARGO porque GitHub corta un trabajo a las SEIS
# HORAS. Una ejecucion entera puede durar mucho mas, asi que se encadenan con
# `needs`: cada uno arranca cuando acaba el anterior.
#
# ─────────────────────────────────────────────────────────────────────────────
# VERAS EJECUCIONES CANCELADAS, Y ES LO NORMAL
# ─────────────────────────────────────────────────────────────────────────────
#
# `cancel-in-progress` tira la ejecucion en curso cuando entra una nueva: la
# nueva toma el relevo en el acto y reinicia las diecisiete horas, que es lo
# que se busca. En la pestaña Actions eso se ve como ejecuciones CANCELADAS.
# No son fallos — son la anterior cediendo el turno. Lo que SI hay que mirar
# es que haya una EN CURSO casi siempre.
#
# ─────────────────────────────────────────────────────────────────────────────
# POR QUE ESTE ARCHIVO VIVE EN UN REPOSITORIO PUBLICO Y APARTE
# ─────────────────────────────────────────────────────────────────────────────
#
# EN UN REPOSITORIO PUBLICO LOS MINUTOS SON ILIMITADOS, y eso es justo lo que
# hace posible el bucle. En uno PRIVADO GitHub regala 2.000 minutos al mes:
# un solo trabajo de 340 minutos se llevaria el 17% de la cuota mensual y
# tres, la mitad. No cabe de ninguna manera.
#
# Aqui no hay nada de BIODCORE: solo este archivo y el script que llama.
# LAS DOS VARIABLES SON SECRETOS DE *ESTE* REPOSITORIO, no del de BIODCORE.
#
# QUE AQUI NO ENTRE NUNCA LA LLAVE DE SERVICIO. La llave `anon` es publica por
# diseño —viaja en el JavaScript que descarga cualquier navegador— y ademas
# las tablas tienen RLS activado sin politicas, asi que con ella no se puede
# leer nada: comprobado, la base responde 401. La llave de servicio se salta
# RLS entera y no pinta en un despertador.

on:
  schedule:
    # Cada cinco minutos es el intervalo minimo que admite GitHub. EN LA
    # PRACTICA DISPARA UNA VEZ CADA CUATRO HORAS —medido— y por eso cada
    # ejecucion cubre diecisiete. Se deja en */5 porque cuanto mas a menudo
    # lo intente, antes relevara a la que este corriendo.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  # Empujar un commit arranca una ejecucion en el acto. Es lo que permite
  # comprobar un cambio sin esperar al reloj — y lo que reinicia el contador
  # de los 60 dias de inactividad.
  push:
    branches: [main]

# Si entra una ejecucion nueva, la vieja se cancela: llegar tarde a despertar
# un servicio no sirve de nada, y la nueva reinicia las diecisiete horas.
concurrency:
  group: mantener-despierto
  cancel-in-progress: true

# El bucle vive en despertar.sh, EN UN SOLO SITIO. Escrito dentro de cada
# trabajo serian tres copias de la misma cuenta, y basta que una se quede sin
# pingear la base para que el relevo de turno deje de mantenerla caliente sin
# que nada lo delate.
env:
  SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  DURACION_MIN: "340"
  # UN PING CADA CINCO MINUTOS NO LO MANTIENE RAPIDO, y esta medido el 1 de
  # noviembre de 2026 CON EL BUCLE YA CORRIENDO: trece lecturas sueltas cada
  # 30 s dieron 0,87 / 2,9 / 3,5 / 4,5 / 6,7 / 7,9 / 8,7 / 12,7 / 13,7 / 15,4
  # / 21,8 / 25,0 / 40,0 segundos. Suben 7 de 12 veces, asi que NO es un
  # arranque en frio —ese baja siempre, 34,5 -> 1,75 -> 0,41— sino un proyecto
  # que se cae del camino rapido en cuanto deja de llegarle trafico.
  #
  # Con peticiones seguidas baja a 0,3 s y se queda ahi, asi que lo que lo
  # sostiene es la CADENCIA. Un minuto es lo mas bajo que tiene sentido sin
  # convertir esto en una carga, y aqui los minutos son gratis.
  #
  # NO CUESTA CUOTA DE LA BASE: la consulta la rechaza RLS antes de leer
  # ninguna fila, asi que no gasta presupuesto de Disk IO. Eso importa porque
  # en el plan gratuito ese presupuesto se agota y la base se arrastra durante
  # horas — y entonces esto no lo arregla ningun despertador.
  INTERVALO: "60"

jobs:
  tramo-1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: bash despertar.sh

  tramo-2:
    needs: tramo-1
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: bash despertar.sh

  tramo-3:
    needs: tramo-2
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: bash despertar.sh
